<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Delivered as a meta tag because GitHub Pages cannot set headers. No inline scripts or
         styles anywhere (element styles are set through the CSSOM). connect-src is open because
         #url= may name any CORS-enabled host; the h5wasm worker runs under its own (same-origin)
         policy. vite.config.ts allows inline styles for the dev server only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src *; img-src 'self' data:; font-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="SPV — Spatial Viewer: a static, browser-based 3D viewer for spatial transcriptomics .h5ad files. Nothing is uploaded; files are read in your browser."
    />
    <title>SPV — Spatial Viewer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='12' r='5' fill='%2366c2a5'/%3E%3Ccircle cx='22' cy='16' r='5' fill='%23fc8d62'/%3E%3Ccircle cx='14' cy='24' r='4' fill='%238da0cb'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="spv-fatal">
        <h1>SPV — Spatial Viewer</h1>
        <h2>JavaScript is turned off</h2>
        <p>
          SPV reads and draws .h5ad files in your browser, which needs JavaScript. Enable it and
          reload the page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
