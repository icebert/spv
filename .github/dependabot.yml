# Weekly dependency updates. package.json pins exact versions, so every bump arrives as a pull
# request that runs the CI workflow (typecheck, lint, unit and end-to-end tests) before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x accepts TypeScript >=4.8.4 <6.1.0, so a TypeScript major bump makes
      # `npm ci` fail with ERESOLVE (PR #2, TypeScript 7.0.2, reverted). Remove this once
      # typescript-eslint supports the new major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
