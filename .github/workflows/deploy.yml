# Build and deploy SPV to GitHub Pages on every push to main.
#
# Setup (once): repository Settings → Pages → Source: "GitHub Actions".
#
# The site is built with VITE_BASE=/<repo-name>/ so it works at https://<user>.github.io/<repo>/.
# For a root site (repository named <user>.github.io) change VITE_BASE below to "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build at the Pages sub-path)
        run: npm run e2e
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
