# Build and deploy SPV to GitHub Pages on every push to main.
#
# Setup (once): repository Settings → Pages → Source: "GitHub Actions".
#
# The site is built with VITE_BASE=/<repo-name>/ so it works at https://<user>.github.io/<repo>/.
# For a root site (repository named <user>.github.io) change VITE_BASE below to "/".
# Pull requests and other branches run the same checks in ci.yml without deploying.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege per job: the build job runs third-party code (npm packages, Playwright) with a
# read-only token and no Pages or OIDC rights; only the deploy job, which runs nothing but the
# deploy action, may publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures and provenance of every installed package
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Bundle budget
        run: npm run budget
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build at the Pages sub-path)
        run: npm run e2e
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Keep Playwright traces and screenshots when a test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
